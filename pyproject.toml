description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mrinal7862", email = "codemaxter473@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "neo4j>=6.3.0",
    "python-dotenv>=1.2.3",
